<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- MOBILE MEIN DESKTOP SITE AUTO MODE KE LIYE YE LINE UPDATE KI HAI -->
    <meta name="viewport" content="width=1024">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;400;700&family=Noto+Sans+Devanagari:wght@600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* 3D EMOJI STYLING */
        img.emoji {
            height: 1.3em;
            width: 1.3em;
            margin: 0 0.15em;
            vertical-align: -0.25em;
            display: inline-block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* CANVAS BACKGROUNDS */
        #starfield, #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #fireworksCanvas {
            z-index: 5;
        }

        /* SCREENS */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
        }
        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* INTRO SCREEN & BUTTON */
        #introScreen {
            z-index: 50;
            background: #000000;
            opacity: 1;
            visibility: visible;
        }
        .start-btn {
            background: linear-gradient(45deg, #d4af37, #ffdf73, #aa771c);
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 700;
            color: #000;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulse 2s infinite;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8), inset 0 0 15px rgba(255, 255, 255, 1);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.8), 0 0 80px rgba(212, 175, 55, 0.2); }
            100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        }

        /* BOTTOM CONTROLS FOR 1ST SCREEN ONLY */
        .bottom-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* CREATOR TAG - LEFT SIDE */
        .creator-tag {
            font-size: 14px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: color 0.3s;
            text-transform: capitalize;
        }
        .creator-tag:hover {
            color: #d4af37;
        }

        /* VOLUME TOGGLE - RIGHT SIDE */
        .volume-label {
            cursor: pointer;
            width: 26px;
            height: 26px;
            position: relative;
            display: block;
        }
        #volume-checkbox {
            display: none; 
        }
        .volume-label svg {
            width: 100%;
            height: 100%;
            fill: rgba(255, 255, 255, 0.6);
            transition: fill 0.3s, transform 0.2s;
            position: absolute;
            top: 0;
            left: 0;
        }
        .volume-label:hover svg {
            fill: #d4af37;
            transform: scale(1.1);
        }
        
        #volume-checkbox:checked ~ .icon-mute { opacity: 0; visibility: hidden; }
        #volume-checkbox:checked ~ .icon-unmute { opacity: 1; visibility: visible; }
        
        #volume-checkbox:not(:checked) ~ .icon-unmute { opacity: 0; visibility: hidden; }
        #volume-checkbox:not(:checked) ~ .icon-mute { opacity: 1; visibility: visible; }

        @media (max-width: 768px) {
            .bottom-controls { padding: 0 20px; bottom: 20px; }
            .creator-tag { font-size: 12px; }
            .volume-label { width: 22px; height: 22px; }
        }

        /* CINEMATIC TEXT SEQUENCE */
        .cinematic-text {
            font-family: 'Noto Sans Devanagari', 'Montserrat', sans-serif;
            font-size: 3vw;
            text-align: center;
            max-width: 80%;
            line-height: 1.6;
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            opacity: 0;
            position: absolute;
            transform: translateY(20px);
        }
        @media (max-width: 768px) {
            .cinematic-text { font-size: 6vw; }
        }

        /* GRAND REVEAL SCREEN */
        #revealScreen {
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px; 
        }
        
        /* 100% CLEAN CROWN */
        .crown {
            width: 75px;
            margin: 0; 
            opacity: 0;
            transform: translateY(-40px);
            filter: drop-shadow(0 0 15px rgba(255, 223, 115, 0.7));
        }

        .happy-birthday-sub {
            font-size: 2.2vw;
            font-weight: 400;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0; 
            opacity: 0;
            transform: translateY(-20px);
        }
        
        /* PERFECT CENTERED NAME TITLE */
        .name-title {
            font-family: 'Cinzel', serif;
            font-size: 11vw;
            font-weight: 900;
            line-height: 1;
            margin: 60; 
            padding: 0 20px;
            text-align: center;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 35px rgba(212, 175, 55, 0.6));
            opacity: 0;
            transform: scale(0.85);
            word-break: break-word;
        }
        
        /* BOTTOM MESSAGE */
        .wish-message {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2vw;
            font-weight: 400;
            color: rgba(252, 246, 186, 0.9); 
            margin: -15px; 
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            #revealScreen { gap: 15px; } 
            .crown { width: 55px; }
            .happy-birthday-sub { font-size: 3.5vw; letter-spacing: 6px; }
            .name-title { font-size: 14vw; }
            .wish-message { 
                font-size: 3vw; 
                padding: 0 15px; 
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Backgrounds -->
    <canvas id="starfield"></canvas>
    <canvas id="fireworksCanvas"></canvas>

    <!-- Hidden Audio -->
    <audio id="bgMusic" loop>
        <source src="https://res.cloudinary.com/qvbwofki/video/upload/v1787492719/Sajid_Wajid_Rahat_Fateh_Ali_Khan_Suzanne_D_Mello_-_Surili_Akhiyon_Wale_Lyric_Video__0_335.mp3">
    </audio>

    <!-- STAGE 1: INTRO -->
    <div id="introScreen" class="screen">
        <button class="start-btn" id="startBtn">Unlock Magic ✨</button>
        
        <div class="bottom-controls" id="bottomControls">
            <a href="https://www.instagram.com/herosalman1_929/" target="_blank" class="creator-tag">Made by : @Herosalman1</a>
            
            <label for="volume-checkbox" title="Toggle sound" class="volume-label">
                <input type="checkbox" id="volume-checkbox" checked>
                <svg class="icon-unmute" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"></path></svg>
                <svg class="icon-mute" viewBox="0 0 24 24"><path d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.5,12.43 16.5,12.21 16.5,12Z"></path></svg>
            </label>
        </div>
    </div>

    <!-- STAGE 2: CINEMATIC SEQUENCE CONTAINER (Dynamic lines will be injected here) -->
    <div id="sequenceScreen" class="screen"></div>

    <!-- STAGE 3: GRAND REVEAL -->
    <div id="revealScreen" class="screen">
        <svg class="crown" id="crownIcon" viewBox="0 0 576 512" fill="url(#goldGradClean)">
            <defs>
                <linearGradient id="goldGradClean" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#bf953f;stop-opacity:1" />
                    <stop offset="25%" style="stop-color:#fcf6ba;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#b38728;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#fbf5b7;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#aa771c;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M576 136c0 22.09-17.91 40-40 40-.24 0-.47-.02-.71-.03l-35.75 187.69C494.3 390.69 470.94 408 443.83 408H132.17c-27.11 0-50.47-17.31-55.71-44.34L40.71 175.97c-.24.01-.47.03-.71.03-22.09 0-40-17.91-40-40s17.91-40 40-40c21.84 0 39.58 17.51 39.99 39.27L189.6 239.5l79.46-174.81C259.95 59.43 256 50.19 256 40c0-22.09 17.91-40 40-40s40 17.91 40 40c0 10.19-3.95 19.43-13.06 24.69l79.46 174.81 109.61-124.23c.41-21.76 18.15-39.27 39.99-39.27 22.09 0 40 17.91 40 40zM128 448h320c17.67 0 32 14.33 32 32s-14.33 32-32 32H128c-17.67 0-32-14.33-32-32s14.33-32 32-32z"/>
        </svg>
        
        <div class="happy-birthday-sub" id="hbSub">Happy Birthday</div>
        <h1 class="name-title" id="nameMain">FRIEND</h1>
        
        <div class="wish-message" id="wishMsg"></div>
    </div>

    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        function parse3DEmojis(element) {
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const nodesToReplace = [];
            const emojiRegex = /(\p{Emoji_Presentation}|\p{Emoji}\uFE0F)/gu;

            while (node = walker.nextNode()) {
                if (emojiRegex.test(node.nodeValue)) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(node => {
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;
                let match;
                emojiRegex.lastIndex = 0;
                
                while ((match = emojiRegex.exec(node.nodeValue)) !== null) {
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex, match.index)));
                    }

                    let hexParts = [];
                    for (let char of match[0]) {
                        let hex = char.codePointAt(0).toString(16);
                        if (hex !== 'fe0f') { 
                            hexParts.push(hex);
                        }
                    }
                    const unicodeStr = hexParts.join('-');

                    const img = document.createElement('img');
                    img.className = 'emoji';
                    img.alt = match[0];
                    img.src = `https://cdn.jsdelivr.net/npm/emoji-datasource-joypixels@7.0.0/img/joypixels/64/${unicodeStr}.png`;
                    img.onerror = function() {
                        this.onerror = null;
                        this.src = `https://cdn.jsdelivr.net/npm/emoji-datasource-apple@14.0.0/img/apple/64/${unicodeStr}.png`;
                    };
                    
                    fragment.appendChild(img);
                    lastIndex = emojiRegex.lastIndex;
                }

                if (lastIndex < node.nodeValue.length) {
                    fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex)));
                }

                node.parentNode.replaceChild(fragment, node);
            });
        }

        // URL se key read karke localStorage se data fetch karna
        const urlParams = new URLSearchParams(window.location.search);
        const shortKey = urlParams.get('key');
        
        let friendName = 'SALMAN';
        let customWish = '🥂 And may all the dreams you have dreamt come true very soon. God bless you 🎉';
        let customLines = [
            "ज़िंदगी के इस सफर में...",
            "कहते हैं, \"हर वो चीज़ जिसका डर होता हैं !\"",
            "आखिर में वो चीज़ होकर ही रहती हैं...",
            "तो आज आप अपने हर उस डर को पीछे छोड़ दो...",
            "क्योंकि आज बहुत ही Special Day है !",
            "Because आज मेरे सबसे प्यारे खास मित्र का Birthday है ..."
        ];

        if (shortKey && localStorage.getItem(shortKey)) {
            try {
                const savedData = JSON.parse(localStorage.getItem(shortKey));
                if (savedData.name) friendName = savedData.name;
                if (savedData.wish) customWish = savedData.wish;
                if (savedData.shayari && Array.isArray(savedData.shayari) && savedData.shayari.length > 0) {
                    customLines = savedData.shayari;
                }
            } catch(e) {
                console.error("Data parse error");
            }
        }

        document.getElementById('nameMain').textContent = friendName.toUpperCase();
        document.title = `Happy Birthday ${friendName}!`;
        document.getElementById('wishMsg').innerHTML = customWish;

        // Dynamic Sequence Lines Inject karna
        const sequenceScreen = document.getElementById('sequenceScreen');
        customLines.forEach((line, index) => {
            const div = document.createElement('div');
            div.className = 'cinematic-text';
            div.id = `text${index + 1}`;
            div.textContent = line;
            sequenceScreen.appendChild(div);
        });

        // Background Music & Volume Logic
        const bgMusic = document.getElementById('bgMusic');
        const volumeCheckbox = document.getElementById('volume-checkbox');

        volumeCheckbox.addEventListener('change', function() {
            bgMusic.muted = !this.checked;
        });

        window.addEventListener('DOMContentLoaded', () => {
            parse3DEmojis(document.body);
        });

        // Background Stars & Fireworks
        const starCanvas = document.getElementById('starfield');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];
        function resizeStars() { starCanvas.width = window.innerWidth; starCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeStars); resizeStars();
        for (let i = 0; i < 200; i++) {
            stars.push({ x: Math.random() * starCanvas.width, y: Math.random() * starCanvas.height, radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.05 });
        }
        function drawStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(star => {
                starCtx.beginPath(); starCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); starCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`; starCtx.fill();
                star.alpha += star.speed; if (star.alpha <= 0 || star.alpha >= 1) star.speed = -star.speed;
            }); requestAnimationFrame(drawStars);
        } drawStars();

        const fwCanvas = document.getElementById('fireworksCanvas'); const fwCtx = fwCanvas.getContext('2d');
        let fireworks = [], particles = [], fireworkActive = false;
        function resizeFw() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeFw); resizeFw();
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.friction = 0.95; this.gravity = 0.1; this.alpha = 1; this.decay = Math.random() * 0.015 + 0.015;
            }
            update() { this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
            draw() { fwCtx.save(); fwCtx.globalAlpha = this.alpha; fwCtx.beginPath(); fwCtx.arc(this.x, this.y, 2, 0, Math.PI * 2); fwCtx.fillStyle = this.color; fwCtx.fill(); fwCtx.restore(); }
        }
        class Firework {
            constructor() {
                this.x = Math.random() * fwCanvas.width; this.y = fwCanvas.height; this.targetY = Math.random() * (fwCanvas.height / 2);
                this.speed = Math.random() * 4 + 4; this.color = `hsl(${Math.random() * 360}, 100%, 60%)`; this.exploded = false;
            }
            update() { this.y -= this.speed; if (this.y <= this.targetY && !this.exploded) { this.exploded = true; this.explode(); } }
            draw() { if (!this.exploded) { fwCtx.beginPath(); fwCtx.arc(this.x, this.y, 3, 0, Math.PI * 2); fwCtx.fillStyle = this.color; fwCtx.fill(); } }
            explode() { for (let i = 0; i < 80; i++) particles.push(new Particle(this.x, this.y, this.color)); }
        }
        function animateFireworks() {
            if(!fireworkActive) { fwCtx.clearRect(0,0, fwCanvas.width, fwCanvas.height); requestAnimationFrame(animateFireworks); return; }
            fwCtx.fillStyle = 'rgba(5, 5, 5, 0.2)'; fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
            if (Math.random() < 0.05) fireworks.push(new Firework());
            fireworks.forEach((fw, idx) => { fw.update(); fw.draw(); if (fw.exploded) fireworks.splice(idx, 1); });
            particles.forEach((p, idx) => { p.update(); p.draw(); if (p.alpha <= 0) particles.splice(idx, 1); });
            requestAnimationFrame(animateFireworks);
        } animateFireworks();

        // 1-by-1 Sequence Animation
        const startBtn = document.getElementById('startBtn');
        const introScreen = document.getElementById('introScreen');
        const bottomControls = document.getElementById('bottomControls');
        const revealScreen = document.getElementById('revealScreen');

        startBtn.addEventListener('click', () => {
            bgMusic.muted = !volumeCheckbox.checked; 
            bgMusic.play().catch(e => console.log("Autoplay blocked:", e));

            const tl = gsap.timeline();

            tl.to([startBtn, bottomControls], { 
                opacity: 0, 
                duration: 1.2, 
                ease: "power2.inOut" 
            })
            .to(introScreen, { 
                opacity: 0, 
                duration: 0.8, 
                ease: "power2.inOut",
                onComplete: () => {
                    introScreen.style.display = 'none';
                    sequenceScreen.classList.add('active');
                }
            }, "+=0.2");

            // Dynamic lines animation loop
            customLines.forEach((_, index) => {
                const id = `#text${index + 1}`;
                tl.to(id, { y: 0, opacity: 1, duration: 2, ease: "power2.out" })
                  .to(id, { y: -20, opacity: 0, duration: 2, delay: 1.5 });
            });

            tl.add(() => {
                sequenceScreen.style.display = 'none';
                revealScreen.classList.add('active');
                fireworkActive = true; 
            });

            tl.to('#crownIcon', { y: 0, opacity: 1, duration: 1.5, ease: "back.out(1.7)" })
              .to('#hbSub', { y: 0, opacity: 1, duration: 1.5, ease: "power2.out" }, "-=0.5")
              .to('#nameMain', { scale: 1, opacity: 1, duration: 2, ease: "elastic.out(1, 0.5)" }, "-=0.8")
              .to('#wishMsg', { y: 0, opacity: 1, duration: 1.5, ease: "power2.out" }, "-=1"); 
        });
    </script>
</body>
</html>
